<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Bar Tickets</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#17202a;--muted:#68737d;--line:#d8dde3;--accent:#2474d8;--meal:#dcecff;--addon:#fff0cf;--danger:#d33b3b}*{box-sizing:border-box}body.dark{--bg:#12161a;--card:#20262c;--ink:#f3f5f7;--muted:#aab4bd;--line:#3b444d;--meal:#183657;--addon:#55401b}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);min-height:100vh}header{display:flex;justify-content:space-between;align-items:center;padding:10px 2px}h1{font-size:24px;margin:0}.top button,button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:15px}main{max-width:700px;margin:auto}.ticket{background:var(--card);border:1px solid var(--line);border-radius:12px;min-height:44vh;max-height:52vh;overflow:auto;padding:14px;font-family:ui-monospace,Menlo,monospace;white-space:pre-wrap;line-height:1.45;font-size:17px}.ticket.empty{color:var(--muted);font-family:inherit;text-align:center;padding-top:70px}.bar{display:flex;gap:8px;align-items:center;margin:10px 0}.bar button{flex:1}.bar .danger{color:var(--danger)}.keys{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.key{display:grid;grid-template-columns:40px 1fr;gap:4px}.key button{min-height:54px;font-weight:700}.key .minus{background:var(--card);color:var(--danger)}.meal button.add{background:var(--meal)}.addon button.add{background:var(--addon)}.divider{grid-column:1/-1;border-top:2px solid var(--line);margin:4px 0}.enter{width:100%;background:var(--accent);color:#fff;border:0;margin-top:10px;font-size:18px;padding:14px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:3}.modal.show{display:flex}.panel{background:var(--card);width:100%;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px}.panel h2{margin:0 0 12px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:9px 0}.row input{width:100px;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}.stats{font-family:ui-monospace,monospace;white-space:pre-wrap;background:var(--bg);padding:10px;border-radius:8px;margin-top:8px}.close{float:right}.small{color:var(--muted);font-size:13px}
</style></head><body><main><header><h1>Bar Tickets</h1><div class="top"><button id="theme">☾</button> <button id="settings">⚙</button></div></header><div id="session" class="small"></div><section id="ticket" class="ticket empty">New ticket</section><div class="bar"><button id="prev">‹ Previous</button><button id="newest">Newest ›</button><button id="delete" class="danger">✕ Delete</button></div><div id="keys" class="keys"></div><button id="enter" class="enter">Enter / Complete Ticket</button></main>
<div id="modal" class="modal"><div class="panel"><button class="close" id="close">Done</button><h2>Settings</h2><p class="small">Prices and names are saved automatically on this device.</p><div class="row"><label>Sales tax (%)</label><input id="tax" type="number" min="0" step=".01"></div><h3>Meals</h3><div id="mealSettings"></div><h3>Add-ons</h3><div id="addonSettings"></div><h3>Session totals</h3><div id="stats" class="stats"></div><button id="clear" style="color:var(--danger);margin-top:12px">Clear all tickets and start new session</button></div></div>
<script>
const defaults={meals:[['STK',0],['CKN',0],['SHP',0],['KBB',0],['MCS',0]],addons:[['stk',0],['ckn',0],['shp',0],['kbb',0],['mcs',0]],tax:0};
let cfg=JSON.parse(localStorage.getItem('barTicketsCfg')||'null')||defaults, tickets=JSON.parse(localStorage.getItem('barTickets')||'[]'), current=-1, draft={};
const $=id=>document.getElementById(id), money=n=>'$'+Number(n||0).toFixed(2), save=()=>{localStorage.setItem('barTicketsCfg',JSON.stringify(cfg));localStorage.setItem('barTickets',JSON.stringify(tickets))};
function ticketText(t){let s=`BAR TICKET  ${t.date}\n#${String(t.seq).padStart(3,'0')}  ${t.time}\n------------------------------\n`;for(const x of t.items)s+=`${x.name.padEnd(5)} ${String(x.qty).padStart(2)} x ${money(x.price).padStart(7)} = ${money(x.qty*x.price).padStart(7)}\n`;s+='------------------------------\n';s+=`SUBTOTAL                 ${money(t.sub).padStart(7)}\nTAX ${Number(cfg.tax).toFixed(2)}%                 ${money(t.tax).padStart(7)}\nTOTAL                    ${money(t.total).padStart(7)}`;return s}
function render(){let t=tickets[current];$('session').textContent=tickets.length?`Session: ${tickets[0].date}  •  ${tickets.length} ticket${tickets.length==1?'':'s'}`:'New session starting';$('ticket').classList.toggle('empty',!t);$('ticket').textContent=t?ticketText(t):'New ticket';$('keys').innerHTML=''; draw(cfg.meals,'meal');$('keys').insertAdjacentHTML('beforeend','<div class="divider"></div>');draw(cfg.addons,'addon');function draw(arr,cl){arr.forEach(([name,price])=>{let q=draft[name]||0;let d=document.createElement('div');d.className='key '+cl;d.innerHTML=`<button class="minus">−</button><button class="add">${name}<br><small>${money(price)} · qty ${q}</small></button>`;d.querySelector('.minus').onclick=()=>{draft[name]=Math.max(0,(draft[name]||0)-1);render()};d.querySelector('.add').onclick=()=>{draft[name]=(draft[name]||0)+1;render()};$('keys').append(d)})}}
function complete(){let items=[...cfg.meals,...cfg.addons].map(([name,price])=>({name,price,qty:draft[name]||0})).filter(x=>x.qty);if(!items.length)return alert('Add at least one item.');let sub=items.reduce((a,x)=>a+x.qty*x.price,0),tax=sub*Number(cfg.tax||0)/100;let now=new Date(),t={seq:tickets.length?Math.max(...tickets.map(x=>x.seq))+1:1,date:now.toLocaleDateString(),time:now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),items,sub,tax,total:sub+tax};tickets.push(t);current=tickets.length-1;draft={};save();render()}
function settings(){ $('tax').value=cfg.tax; $('mealSettings').innerHTML='';$('addonSettings').innerHTML=''; add(cfg.meals,'mealSettings');add(cfg.addons,'addonSettings');stats();$('modal').classList.add('show');function add(arr,id){arr.forEach((x,i)=>{let r=document.createElement('div');r.className='row';r.innerHTML=`<label>${x[0]}</label><input type="number" min="0" step=".01" value="${x[1]}">`;r.querySelector('input').onchange=e=>{arr[i][1]=Number(e.target.value)||0;save();render()};$(id).append(r)})}}
function stats(){let total=tickets.reduce((a,t)=>a+t.total,0), by={};tickets.forEach(t=>t.items.forEach(x=>{by[x.name]=(by[x.name]||0)+x.qty}));$('stats').textContent=`Tickets: ${tickets.length}\nGrand total: ${money(total)}\n\nItem quantities:\n`+Object.entries(by).map(x=>`${x[0].padEnd(5)} ${x[1]}`).join('\n')}
$('enter').onclick=complete;$('settings').onclick=settings;$('close').onclick=()=>{$('modal').classList.remove('show');render()};$('tax').onchange=e=>{cfg.tax=Number(e.target.value)||0;save();render()};$('clear').onclick=()=>{if(confirm('Delete every ticket and begin a new session?')){tickets=[];current=-1;draft={};save();settings();render()}};$('delete').onclick=()=>{if(current>=0&&confirm('Delete this ticket?')){tickets.splice(current,1);current=Math.min(current,tickets.length-1);save();render()}};$('newest').onclick=()=>{current=tickets.length-1;render()};$('prev').onclick=()=>{if(tickets.length)current=(current<=0?tickets.length-1:current-1);render()};$('theme').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('barDark',document.body.classList.contains('dark'))};if(localStorage.getItem('barDark')==='true')document.body.classList.add('dark');render();
</script></body></html>
